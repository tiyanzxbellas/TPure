<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman tidak ketemu — TiyanPure</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="/assets/icons/favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Helvetica,Arial,sans-serif;background:#05080f;color:#e8f1ff;min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.box{max-width:420px}
img{width:100px;height:100px;border-radius:24px}
h1{margin:14px 0 6px;font-size:2.2rem}
p{color:#8ea3c2;margin-bottom:8px}
a.btn{display:block;background:linear-gradient(135deg,#24cd77,#0a9b57);color:#04120a;font-weight:800;
border-radius:10px;padding:12px;margin-top:10px;text-decoration:none}
a.ghost{background:transparent;border:1px solid rgba(56,189,248,.3);color:#8ea3c2}
.links{margin-top:14px;font-size:1.3rem}
.links a{color:#38bdf8;text-decoration:none;margin:0 6px}
</style>
<script>
/* Router darurat: bikin URL cantik tetap jalan walau hosting tidak baca
   vercel.json / .htaccess / _redirects (cth: GitHub Pages, hosting statis polos).
   Anti-loop via sessionStorage. */
(function () {
  try {
    var p = location.pathname.replace(/\/+$/, '') || '/';
    var seg = p.split('/').filter(Boolean);
    var target = null;
    var LIST = ['game', 'app', 'discover', 'pre-register', 'game-24h', 'app-24h',
      'editor-choice', 'game-sales', 'partner-developers'];
    var INFO = ['about', 'contact-us', 'cooperation', 'support', 'privacy-policy',
      'copyright-policy', 'terms', 'eu-amau', 'tiyanpure-app', 'submit-apk', 'search', 'offline'];
    if (seg[0] === 'd' && seg[1]) {
      target = '/apk.html?pkg=' + encodeURIComponent(seg[1]);
    } else if (seg[0] === 'dl' && seg[1]) {
      target = '/dl.html?pkg=' + encodeURIComponent(seg[1]) + location.search.replace(/^\?/, '&');
    } else if (seg.length === 1 && LIST.indexOf(seg[0]) > -1) {
      target = '/' + seg[0] + '.html';
    } else if (seg[0] === 'topic' && seg[1]) {
      target = '/topic/' + seg[1] + '.html';
    } else if (seg.length === 1 && INFO.indexOf(seg[0]) > -1) {
      target = '/' + seg[0] + '.html';
    }
    if (target) {
      var key = 'tp404:' + p;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');
        location.replace(target);
        return;
      }
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="box">
  <img src="/assets/icons/icon-192x192.png" alt="TiyanPure" onerror="this.style.display='none'">
  <h1>404 — Nyasar ya? 🧭</h1>
  <p>Halaman yang kamu cari tidak ada atau sudah pindah.</p>
  <a class="btn" href="/">🏠 Kembali ke Beranda</a>
  <a class="btn ghost" href="/game">🎮 Jelajah Game</a>
  <div class="links">
    <a href="/app">Aplikasi</a>·<a href="/discover">Menemukan</a>·<a href="/search.html?q=game">Cari</a>·<a href="/support.html">Bantuan</a>
  </div>
</div>
</body>
</html>
